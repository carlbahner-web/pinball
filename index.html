<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a22" />
  <title>Puppy Care</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1a1a22;
      color: #f4f4f4;
      font-family: "Courier New", monospace;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 0 4px #333, 0 0 30px rgba(0,0,0,0.6);
      display: block;
      touch-action: none;
    }
    #hint {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0.75;
      text-align: center;
    }
    kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1px 6px;
      font-family: inherit;
    }

    /* --- Touch controls --- */
    #controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 10;
    }
    body.touch #controls { display: block; }
    body.touch #hint { display: none; }

    #stickZone {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 45%;
      height: 55%;
      pointer-events: auto;
    }
    #stickBase {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.25);
      left: 24px;
      bottom: 32px;
      display: none;
    }
    #stickNub {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      left: 26px;
      top: 26px;
    }

    #buttons {
      position: absolute;
      right: 16px;
      bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.35);
      color: #f4f4f4;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: rgba(255,255,255,0.35); }
    .btn.small {
      width: 56px;
      height: 56px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hint">
      <kbd>&larr;&uarr;&darr;&rarr;</kbd> / <kbd>WASD</kbd> move &nbsp;
      <kbd>Space</kbd> pick up puppy &nbsp;
      <kbd>E</kbd> use station &nbsp;
      <kbd>Q</kbd> cycle accessory
    </div>
  </div>

  <div id="controls">
    <div id="stickZone">
      <div id="stickBase"><div id="stickNub"></div></div>
    </div>
    <div id="buttons">
      <button class="btn small" id="btnAcc">ACC</button>
      <button class="btn" id="btnUse">USE</button>
      <button class="btn" id="btnPick">PICK</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
