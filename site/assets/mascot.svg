<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" role="img" aria-label="BUZZ, the StudioLand mascot">
  <!-- PLACEHOLDER ONLY. BUZZ is finished artwork with a full pose library —
       drop the real cutout in over this file (PNG is fine; update the <img>
       src). Built to the model-sheet notes in Brand Bible 1.4 so it isn't
       wildly off-brand in the meantime: tambourine head ringed with jingles,
       charcoal rubber-hose limbs, cream bulb shoes with a Rusty sole line,
       small brand-RED mouth, buck teeth (grin only). -->
  <g stroke="#2C2C2A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

    <!-- rubber-hose legs -->
    <path d="M118 232v52l-14 26" fill="none" />
    <path d="M162 232v52l16 26" fill="none" />
    <!-- bulb shoes -->
    <ellipse cx="92"  cy="322" rx="30" ry="17" fill="#fcf7e8" />
    <ellipse cx="190" cy="322" rx="30" ry="17" fill="#fcf7e8" />
    <!-- thin Rusty sole line -->
    <g stroke="#BF7538" stroke-width="5">
      <path d="M64 328c14 9 42 9 56 0" fill="none" />
      <path d="M162 328c14 9 42 9 56 0" fill="none" />
    </g>

    <!-- rubber-hose arms -->
    <path d="M62 150l-30 30 6 34" fill="none" />
    <path d="M216 138l30-34 14-8" fill="none" />
    <!-- four-finger gloves -->
    <circle cx="38"  cy="222" r="21" fill="#fcf7e8" />
    <g fill="#fcf7e8">
      <circle cx="262" cy="90" r="20" />
      <path d="M252 76l-4-22M262 72l0-24M274 78l6-22" fill="none" />
    </g>

    <!-- tambourine head -->
    <circle cx="140" cy="140" r="86" fill="#fcf7e8" />
    <circle cx="140" cy="140" r="70" fill="none" stroke-width="6" />
    <!-- jingles -->
    <g fill="none" stroke-width="5">
      <ellipse cx="140" cy="58"  rx="11" ry="6" />
      <ellipse cx="198" cy="82"  rx="11" ry="6" transform="rotate(45 198 82)" />
      <ellipse cx="222" cy="140" rx="6"  ry="11" />
      <ellipse cx="198" cy="198" rx="11" ry="6" transform="rotate(-45 198 198)" />
      <ellipse cx="140" cy="222" rx="11" ry="6" />
      <ellipse cx="82"  cy="198" rx="11" ry="6" transform="rotate(45 82 198)" />
      <ellipse cx="58"  cy="140" rx="6"  ry="11" />
      <ellipse cx="82"  cy="82"  rx="11" ry="6" transform="rotate(-45 82 82)" />
    </g>

    <!-- face -->
    <g fill="#fcf7e8" stroke-width="7">
      <ellipse cx="116" cy="122" rx="19" ry="23" />
      <ellipse cx="166" cy="122" rx="19" ry="23" />
    </g>
    <g fill="#2C2C2A" stroke="none">
      <circle cx="120" cy="126" r="9" />
      <circle cx="170" cy="126" r="9" />
    </g>
    <!-- brand-RED mouth -->
    <path d="M104 160c10 22 62 22 74 0" fill="#c05838" stroke-width="7" />
    <!-- buck teeth: grin expression only -->
    <g fill="#fcf7e8" stroke="none">
      <rect x="128" y="162" width="12" height="13" rx="2" />
      <rect x="144" y="162" width="12" height="13" rx="2" />
    </g>
  </g>
</svg>
